# VOGUE Benchmark Environment Configuration
#
# Shared parameters for the canonical VOGUE capture and evaluation commands.
#
# Edit this file to change any shared benchmark parameter; the scripts will
# pick up changes automatically.  Values that are machine-specific (binary
# paths, device names) are kept here for documentation; override them via
# environment variables (LLAMA_ROOT, VK_BENCH, etc.) or CLI arguments.

# ── Model ────────────────────────────────────────────────────────────────────
model:
  path: "tmp/archive-llm-substrate/models/tiny-random-LlamaForCausalLM-Q2_K.gguf"
  params_m: 4.12               # millions of parameters
  gflop_per_token: 0.008       # 2 × 4.12M params ≈ 8.24 MFLOP/token = 0.008 GFLOP/token
  description: "tiny-random-LlamaForCausalLM Q2_K (4.12M params, 11.6 MiB)"

# ── llama-bench shared arguments ────────────────────────────────────────────
llama_bench:
  prompt_tokens: [128, 512]    # -p values
  gen_tokens: [128]            # -n values
  n_repeats: 5                 # -r
  output_format: json          # -o json
  # Derived CLI args: ["-p", "128", "-p", "512", "-n", "128", "-r", "5", "-o", "json"]

# ── Binary paths (override via env vars) ────────────────────────────────────
binaries:
  llama_root:   "/home/jerrytsai/llama.cpp"
  llama_cpu:    "/home/jerrytsai/llama.cpp/build-cpu/bin/llama-bench"
  llama_vulkan: "/home/jerrytsai/llama.cpp/build-vulkan/bin/llama-bench"
  llama_cuda:   "/home/jerrytsai/llama.cpp/build-cuda/bin/llama-bench"
  qemu:         "qemu-system-x86_64"

# ── Unikraft kernel images ───────────────────────────────────────────────────
kernels:
  unikraft_cpu:      ".unikraft/build/vogue-llama-cpu_qemu-x86_64"
  unikraft_vk_bench: ".unikraft/build/vogue-llama-vk-bench_qemu-x86_64"
  unikraft_vk_cpp:   ".unikraft/build/vogue-llama-vk-cpp_qemu-x86_64"
  unikraft_vk:       ".unikraft/build/vogue-llama-vk_qemu-x86_64"

# ── Vulkan / ICD ─────────────────────────────────────────────────────────────
vulkan:
  lavapipe_icd: "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
  venus_protocol_headers: "/home/jerrytsai/venus-protocol/include"
  vulkan_loader_lib:      "/usr/lib/x86_64-linux-gnu/libvulkan.so.1"

# ── QEMU parameters (Unikraft environments) ──────────────────────────────────
qemu:
  vcpus: 4                     # -smp N  (ENV9/ENV10/ENV11)
  memory_mb: 1024              # -m M
  boot_timeout_s: 120          # max wait for guest serial output
  # VirtIO-GPU device string for Venus:
  vgpu_device: "virtio-gpu-gl-pci,hostmem=512M,blob=true,venus=true"

# ── Unikraft VirtIO-GPU Venus GEMM benchmark ────────────────────────────────
unikraft_vk_bench:
  gemm_M: 512
  gemm_K: 512
  gemm_N: 512
  n_batch: 4                   # vkCmdDispatch calls per command buffer (Phase B)
  n_submits: 16                # QueueSubmit calls per timed run
  n_iter: 64                   # total GPU dispatches (n_batch × n_submits)
  n_runs: 5                    # repeated boot/measure cycles per ENV row

# ── vk.ggml-dispatch static dispatch layer test ───────────────────────────────────────────
n3_dispatch:
  test_binary: "tests/build/uk_ggml_vulkan_dispatch_test"
  expected_checks: 164
  evidence_id: "llama-vk-n3-dispatch"
  evidence_line: "uk-llama-vk-n3: PASS evidence_id=llama-vk-n3-dispatch"
  timeout_s: 30
  # What this test covers:
  #   Group A: proc lookup (80 Vulkan function names via vkGetInstanceProcAddr)
  #   Group B: dispatch init (uk_ggml_vulkan_dispatch_init via vk.drm-shim DRM fake)
  #   Group C: per-stub VK_SUCCESS + handle allocation (50 checks)
  #   Group D: 23-step full compute bootstrap (CreateInstance→WaitForFences)
  # Transport: Venus SUBMIT_3D via vk.drm-shim DRM fake backend (no QEMU needed)
  # Key properties: no dlopen, no host libvulkan.so, static dispatch table

# ── Hardware (informational; written into bench manifests) ───────────────────
hardware:
  host_cpu:  "AMD EPYC 7543P 32-Core Processor"
  host_gpu:  "NVIDIA RTX 4000 Ada Generation (20 GB)"
  host_ram_gb: 256

# ── Environment definitions ──────────────────────────────────────────────────
# Documents the expected benchmark environments consumed by evaluation reports.
environments:
  ENV0a:
    id: baremetal_cpu_1t
    label: "Baremetal CPU (1 thread)"
    backend: CPU
    threads: 1
    binary: llama_cpu
    device: "AMD EPYC 7543P"

  ENV0b:
    id: baremetal_cpu_32t
    label: "Baremetal CPU (32 threads)"
    backend: CPU
    threads: 32
    binary: llama_cpu
    device: "AMD EPYC 7543P"

  ENV1:
    id: baremetal_vulkan_gpu
    label: "Baremetal Vulkan GPU"
    backend: "Vulkan/GPU"
    binary: llama_vulkan
    vk_device_index: 0
    device: "NVIDIA RTX 4000 Ada (20 GB)"

  ENV2:
    id: baremetal_vulkan_llvmpipe
    label: "Baremetal Vulkan (llvmpipe)"
    backend: "Vulkan/CPU"
    binary: llama_vulkan
    vk_device_index: 1
    device: "llvmpipe (CPU)"

  ENV3:
    id: baremetal_cuda
    label: "Baremetal CUDA"
    backend: CUDA
    binary: llama_cuda
    device: "NVIDIA RTX 4000 Ada (20 GB)"

  ENV4a:
    id: qemu_vm_linux_cpu_1t
    label: "QEMU-VM Linux CPU (1 thread)"
    backend: CPU
    threads: 1
    via: vm_ssh
    device: "KVM vCPU (AMD EPYC 7543P)"

  ENV4b:
    id: qemu_vm_linux_cpu
    label: "QEMU-VM Linux CPU (4 threads)"
    backend: CPU
    threads: 4
    via: vm_ssh
    device: "KVM vCPU (AMD EPYC 7543P)"

  ENV5:
    id: qemu_vm_linux_vulkan
    label: "QEMU-VM Linux Vulkan (llvmpipe)"
    backend: "Vulkan/CPU"
    via: vm_ssh
    device: "llvmpipe via QEMU virtio-gpu-gl"

  ENV6:
    id: qemu_vm_virtio_gpu
    label: "QEMU-VM VirtIO-GPU Venus (Linux)"
    backend: "Vulkan/GPU"
    via: vm_ssh
    device: "NVIDIA RTX 4000 Ada via Venus"

  ENV7:
    id: qemu_unikraft_cpu
    label: "QEMU+Unikraft CPU substrate"
    backend: CPU
    kernel: unikraft_cpu
    via: unikraft_boot
    device: "KVM vCPU (AMD EPYC 7543P)"

  ENV9:
    id: qemu_unikraft_virtio_gpu_llvmpipe
    label: "QEMU+Unikraft VirtIO-GPU Venus (llvmpipe)"
    backend: "Vulkan compute via VirtIO-GPU Venus"
    kernel: unikraft_vk_bench
    via: unikraft_boot_vk
    vk_icd: lavapipe
    device: "llvmpipe (software Vulkan)"

  ENV10:
    id: qemu_unikraft_virtio_gpu
    label: "QEMU+Unikraft VirtIO-GPU Venus (GPU, KVM)"
    backend: "Vulkan compute via VirtIO-GPU Venus"
    kernel: unikraft_vk_bench
    via: unikraft_boot_vk_nvidia
    vk_icd: nvidia_default
    device: "NVIDIA RTX 4000 Ada via Venus (KVM)"

  ENV11:
    id: n3_static_dispatch
    label: "vk.ggml-dispatch Static Vulkan ICD dispatch (host)"
    backend: "Venus-static-ICD (no QEMU)"
    via: native_test
    test_binary: "tests/build/uk_ggml_vulkan_dispatch_test"
    expected_checks: 164
    evidence_id: "llama-vk-n3-dispatch"
    device: "host CPU (fake VirtIO-GPU backend)"
    notes: >
      Host-side regression test for libukggml_vulkan/uk_vulkan_dispatch.c.
      80+ Vulkan C ABI stubs backed by Venus SUBMIT_3D encoder.
      No QEMU required: uses tests/virtio_gpu_fake.c fake backend.
      Verifies that vkGetInstanceProcAddr returns pointers to all
      required Vulkan entry points and that ggml-vulkan.cpp's full
      compute bootstrap sequence (CreateInstance→WaitForFences) completes.
